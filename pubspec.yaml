name: rss_reader
description: Local RSS reader with Gemma AI summaries and TTS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # RSS / HTTP
  webfeed_plus: ^1.1.2
  http: ^1.2.0

  # Database locale
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # HTML parsing
  html: ^0.15.4
  xml: ^6.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI extras
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Gemma (on-device AI) - da abilitare quando il modello è pronto
  flutter_gemma: ^0.12.6

  # File picker (caricamento modello locale)
  file_picker: ^8.0.0

  # Estrazione archivi zip/tar per il modello Gemma
  archive: ^3.6.0
  tar: ^2.0.0

  # Background TTS (foreground service notification)
  flutter_foreground_task: ^8.0.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  sqlite3: ^2.9.0
  riverpod_generator: ^2.4.3

dependency_overrides:
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/
